name: atlas-mvp

services:
  api:
    container_name: ${MVP_API_CONTAINER_NAME:-atlas-mvp-api}
    image: ${MVP_API_IMAGE:-crosstext2loc-gb10:f511}
    gpus: all
    init: true
    read_only: true
    restart: "no"
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      HOME: /root
      HF_HOME: /tmp/huggingface
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace/project/external/CVG-Text
      CLIP_WEIGHTS_PATH: /root/.cache/clip/ViT-L-14-336px.pt
      ATLAS_API_HOST: 0.0.0.0
      ATLAS_API_PORT: "8000"
      ATLAS_QWEN_MODEL_PATH: /models/Qwen3-8B
      ATLAS_QWEN_MODEL_ID: Qwen/Qwen3-8B
      ATLAS_QWEN_MODEL_REVISION: b968826d9c46dd6066d109eabc6255188de91218
      ATLAS_QWEN_REQUIRED: "true"
      ATLAS_VISUAL_PROMOTION_ENABLED: ${ATLAS_VISUAL_PROMOTION_ENABLED:-false}
      ATLAS_VISUAL_PRECOMPUTED_BUNDLE: ${ATLAS_VISUAL_PRECOMPUTED_BUNDLE_CONTAINER:-}
      ATLAS_VISUAL_PROMOTION_FALLBACK: baseline
      ATLAS_VISUAL_PROMOTION_REQUIRED: "false"
      ATLAS_DIALOGUE_ENABLED: ${ATLAS_DIALOGUE_ENABLED:-false}
      ATLAS_DIALOGUE_COHORT_PATH: /dialogue-inputs/cohort.json
      ATLAS_DIALOGUE_SESSION_ROOT: /dialogue-sessions
      ATLAS_DIALOGUE_IMAGE_ROOT: /dialogue-images
      ATLAS_DIALOGUE_COMPLETED_QUERY_IDS: ${ATLAS_DIALOGUE_COMPLETED_QUERY_IDS:-H26}
      ATLAS_DIALOGUE_AUTHORIZATION_PATH: /dialogue-inputs/session-authorization.json
      ATLAS_DIALOGUE_VARIANTS_PATH: /dialogue-inputs/description-length-manifest.json
      ATLAS_DIALOGUE_F3_BUNDLE: ${ATLAS_DIALOGUE_F3_BUNDLE_CONTAINER:-/workspace/project/data/processed/osm/osm-madrid-pilot-osmxml-sha256-f2152555c742ab5fbe54b02fe7145c144757d00ed3941695856db9a52b983141/f3-madrid-pilot-associations-sha256-5f4af89b9349de792d3a60752a15f227d49b96cdb688a671504e4cf30bf68453}
      ATLAS_OLLAMA_PS_URL: ${ATLAS_OLLAMA_PS_URL:-http://host.docker.internal:11434/api/ps}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    volumes:
      - .:/workspace/project:ro
      - ${MVP_CLIP_CACHE_DIR:-${HOME}/.cache/clip}:/root/.cache/clip:ro
      - ${MVP_QWEN_MODEL_DIR:-${HOME}/models/hf/Qwen3-8B-b968826d9c46}:/models/Qwen3-8B:ro
      - ${MVP_VISUAL_BUNDLE_DIR:-./config}:/visual-bundles:ro
      - ${MVP_DIALOGUE_COHORT_FILE:-./config/dialogue_development_h26_h37_cohort.json}:/dialogue-inputs/cohort.json:ro
      - ${MVP_DIALOGUE_AUTHORIZATION_FILE:-./config/dialogue_h27_session_authorization.request.json}:/dialogue-inputs/session-authorization.json:ro
      - ${MVP_DIALOGUE_VARIANTS_FILE:-./results/generated/description-length-experiments/manifest.json}:/dialogue-inputs/description-length-manifest.json:ro
      - ${MVP_DIALOGUE_SESSION_DIR:-./results/generated/mvp-dialogue-sessions}:/dialogue-sessions:rw
      - ${MVP_DIALOGUE_IMAGE_DIR:-./data/cache/mapillary/images}:/dialogue-images:ro
      - ${MVP_PROCESSED_DATA_DIR:-./data/processed}:/workspace/project/data/processed:ro
      - ${MVP_EMBEDDINGS_DIR:-./data/embeddings}:/workspace/project/data/embeddings:ro
      - ${MVP_EXTERNAL_DIR:-./external}:/workspace/project/external:ro
      - ${MVP_CHECKPOINT_DIR:-./checkpoints/CrossText2Loc}:/workspace/project/checkpoints/CrossText2Loc:ro
    working_dir: /workspace/project
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/bash
      - -lc
      - >-
        export ATLAS_CVG_UTILS_SHA256=$$(sha256sum
        /workspace/project/external/CVG-Text/utils.py | cut -d' ' -f1) &&
        if [ "$${ATLAS_DIALOGUE_ENABLED}" = "true" ]; then
          exec python -m uvicorn backend.atlas_api.dialogue_main:app --host 0.0.0.0 --port 8000 --workers 1;
        else exec /workspace/project/scripts/run_mvp1_api.sh; fi
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 36
      start_period: 120s
    networks:
      - internal

  frontend:
    container_name: ${MVP_FRONTEND_CONTAINER_NAME:-atlas-mvp-frontend}
    image: ${MVP_FRONTEND_IMAGE:-atlas-mvp-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    read_only: true
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MVP_BIND_HOST:-0.0.0.0}:${MVP_HTTP_PORT:-8080}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
    volumes:
      - ${MVP_MAP_ASSETS_DIR:-./data/processed/map-assets}:/usr/share/nginx/map-assets:ro
      - ${MVP_MAP_CONTEXT_DIR:-./results/generated/map-assets-context-2000m}:/usr/share/nginx/map-context:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks:
      - internal

  browser-check:
    profiles: ["test"]
    image: ${MVP_BROWSER_IMAGE:-atlas-mvp-browser-check:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.browser
    init: true
    shm_size: 512m
    environment:
      CHROME_PATH: /usr/bin/chromium
      MVP_BASE_URL: http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal: {}
