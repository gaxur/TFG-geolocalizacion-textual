services:
  api:
    build:
      context: ./frontend/tests/nginx-fixture
    expose:
      - "8000"
  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${FREETEXT_NGINX_TEST_PORT:-18080}:8080"
  browser-check:
    profiles:
      - test
    build:
      context: ./frontend
      dockerfile: Dockerfile.browser
    depends_on:
      - frontend
    environment:
      FREETEXT_NGINX_TEST_URL: http://frontend:8080
    command: ["npm", "run", "test:integration:freetext-nginx"]
