name: atlas-app

services:
  api:
    image: ${APP_API_IMAGE:-atlas-app-api:local}
    build:
      context: .
      dockerfile: docker/app-api.Dockerfile
    pull_policy: never
    gpus: all
    init: true
    read_only: true
    restart: unless-stopped
    depends_on:
      resource-monitor:
        condition: service_healthy
    environment:
      ATLAS_API_HOST: 0.0.0.0
      ATLAS_API_PORT: "8000"
      ATLAS_RUNTIME_CONFIG: /workspace/project/config/madrid_f46_retriever.json
      ATLAS_REGION_CONFIG: /workspace/project/config/madrid.yaml
      ATLAS_QWEN_MODEL_PATH: /models/Qwen3-8B
      ATLAS_QWEN_MODEL_ID: Qwen/Qwen3-8B
      ATLAS_QWEN_MODEL_REVISION: b968826d9c46dd6066d109eabc6255188de91218
      ATLAS_QWEN_REQUIRED: "false"
      ATLAS_DIALOGUE_ENABLED: "false"
      ATLAS_FREETEXT_OPERATIONAL_ENABLED: "false"
      ATLAS_FREETEXT_APPLICATION_ENABLED: ${APP_MODE_ENABLED:-true}
      ATLAS_FREETEXT_APPLICATION_PROFILE: /application-config/profile.json
      ATLAS_FREETEXT_APPLICATION_STATE_ROOT: /application-state
      ATLAS_FREETEXT_APPLICATION_SESSION_ROOT: /application-state/sessions
      ATLAS_DIALOGUE_F3_BUNDLE: /workspace/project/data/processed/osm/osm-madrid-pilot-osmxml-sha256-f2152555c742ab5fbe54b02fe7145c144757d00ed3941695856db9a52b983141/f3-madrid-pilot-associations-sha256-5f4af89b9349de792d3a60752a15f227d49b96cdb688a671504e4cf30bf68453
      ATLAS_OLLAMA_PS_URL: http://resource-monitor:8081/api/ps
      ATLAS_OLLAMA_STATUS_CONFIG: /application-config/ollama-status-nginx.conf
      ATLAS_VISUAL_PROMOTION_ENABLED: "false"
      ATLAS_VISUAL_PROMOTION_REQUIRED: "false"
      CUDA_VISIBLE_DEVICES: ${APP_CUDA_VISIBLE_DEVICES:-0}
      CLIP_WEIGHTS_PATH: /root/.cache/clip/ViT-L-14-336px.pt
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace/project/external/CVG-Text
      HOME: /root
      HF_DATASETS_OFFLINE: "1"
      HF_HOME: /tmp/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_DISABLED: "true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${APP_API_TMPFS_SIZE:-2g}
    volumes:
      - ${APP_CLIP_CACHE_DIR:-./models/clip}:/root/.cache/clip:ro
      - ${APP_QWEN_MODEL_DIR:-./models/Qwen3-8B}:/models/Qwen3-8B:ro
      - ${APP_PROCESSED_DATA_DIR:-./data/processed}:/workspace/project/data/processed:ro
      - ${APP_EMBEDDINGS_DIR:-./data/embeddings}:/workspace/project/data/embeddings:ro
      - ${APP_EXTERNAL_DIR:-./external}:/workspace/project/external:ro
      - ${APP_CHECKPOINT_DIR:-./checkpoints/CrossText2Loc}:/workspace/project/checkpoints/CrossText2Loc:ro
      - ${APP_PROFILE_FILE:-./config/freetext_application_profile.template.json}:/application-config/profile.json:ro
      - ./docker/ollama-status-nginx.conf:/application-config/ollama-status-nginx.conf:ro
      - app-state:/application-state
    working_dir: /workspace/project
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/bash
      - -lc
      - >-
        export ATLAS_CVG_UTILS_SHA256=$$(sha256sum
        /workspace/project/external/CVG-Text/utils.py | cut -d' ' -f1) &&
        exec /workspace/project/scripts/run_mvp1_api.sh
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 36
      start_period: 180s
    networks:
      - app-backend

  resource-monitor:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    read_only: true
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/ollama-status-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=8m
      - /var/run:rw,noexec,nosuid,size=1m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/api/ps"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks:
      - app-backend
      - app-edge

  frontend:
    image: ${APP_FRONTEND_IMAGE:-atlas-app-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.app
    init: true
    read_only: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-18085}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
    volumes:
      - ${APP_MAP_ASSETS_DIR:-./data/processed/map-assets}:/usr/share/nginx/map-assets:ro
      - ${APP_MAP_CONTEXT_DIR:-./results/generated/map-assets-context-2000m}:/usr/share/nginx/map-context:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - app-backend
      - app-edge

networks:
  app-backend:
    internal: true
  app-edge: {}

volumes:
  app-state:
    name: ${APP_STATE_VOLUME:-atlas-app-state}
