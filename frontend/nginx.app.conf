server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    if ($remote_addr !~ "^(127\.0\.0\.1|::1|172\.|192\.168\.|10\.)") { return 403; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /api/v1/health/live { proxy_pass http://api:8000; proxy_set_header X-Atlas-App-Loopback 1; }
    location = /api/v1/health/ready { proxy_pass http://api:8000; proxy_set_header X-Atlas-App-Loopback 1; }
    location = /api/v1/capabilities { proxy_pass http://api:8000; proxy_set_header X-Atlas-App-Loopback 1; }

    location = /api/v1/dialogue-freetext/policies { proxy_pass http://api:8000; proxy_set_header X-Atlas-App-Loopback 1; }
    location = /api/v1/dialogue-freetext/pilots { proxy_pass http://api:8000; proxy_set_header X-Atlas-App-Loopback 1; }
    location = /api/v1/dialogue-freetext/pilot { proxy_pass http://api:8000; proxy_set_header X-Atlas-App-Loopback 1; }
    location = /api/v1/dialogue-freetext/sessions { proxy_pass http://api:8000; proxy_set_header X-Atlas-App-Loopback 1; client_max_body_size 8k; }
    location ~ "^/api/v1/dialogue-freetext/application/operations/[A-Za-z0-9._-]+$" { proxy_pass http://api:8000; proxy_set_header X-Atlas-App-Loopback 1; }
    location ~ "^/api/v1/dialogue-freetext/sessions/freetext-application-[0-9a-f-]{36}(/answers|/events|/events/stream)?$" {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Atlas-App-Loopback 1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 8k;
    }
    location /api/v1/dialogue-freetext/ { return 404; }

    location /api/ { return 404; }
    location ^~ /map-assets/ { alias /usr/share/nginx/map-assets/; autoindex off; add_header Accept-Ranges bytes always; add_header Cache-Control "public, max-age=3600" always; types { application/json json; application/geo+json geojson; application/vnd.pmtiles pmtiles; } }
    location ^~ /map-context/ { alias /usr/share/nginx/map-context/; autoindex off; add_header Accept-Ranges bytes always; add_header Cache-Control "public, max-age=3600" always; types { application/vnd.pmtiles pmtiles; application/json json; } }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:css|js|png|svg|woff2?)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
}
